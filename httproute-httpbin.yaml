apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-route
  namespace: default
spec:
  parentRefs:
    - name: eg-gateway
  hostnames:
    - "api.company.local"
  rules:
    # Path-based routing: /orders -> httpbin, rewritten to /anything
    # (httpbin's /anything endpoint echoes back the full request, handy for curl testing)
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /anything
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Environment
                value: production
              - name: X-Gateway
                value: envoy-gateway
      backendRefs:
        - name: httpbin
          port: 80

    # Default path for the same host
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: httpbin
          port: 80
