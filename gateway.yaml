# GatewayClass is installed automatically by the Envoy Gateway Helm chart
# (named "eg"). We reference it below.

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg-gateway
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: company-local-tls   # created by cert-manager in Assignment 3
      allowedRoutes:
        namespaces:
          from: Same
